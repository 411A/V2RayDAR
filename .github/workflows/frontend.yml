name: Frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "src/web.rs"
      - "src/server.rs"
      - "src/tui/util.rs"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/web.rs"
      - "src/server.rs"
      - "src/tui/util.rs"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-static-perf:
    name: Unit / static gates / perf (node:test, no browser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (unit tests need no extra deps)
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Unit + static gates + perf budgets
        working-directory: frontend
        run: npm run test:unit

  e2e-chromium:
    name: E2E Chromium (stub origin server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: E2E (full chromium suite, stub origin server)
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore

  rust-gates:
    name: Rust fmt + strict clippy + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --check

      - name: Strict clippy (nursery + pedantic deny)
        run: cargo clippy --locked --all-targets -- -D warnings -W clippy::nursery -W clippy::pedantic

      - name: Tests
        run: cargo test --locked
